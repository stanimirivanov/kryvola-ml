[project]
name = "kryvola-ml"
version = "0.1.0.dev0"
description = "Kryvola M0 foundation; no production execution capability"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "jsonschema==4.26.0",
    "protobuf==7.35.1",
]

[dependency-groups]
dev = ["ruff==0.17.2", "ty==0.0.91", "hatchling==1.32.4"]

[tool.uv]
required-version = "==0.12.5"
package = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/_spec/**", "**/_wire/**", "contracts", "build", "target", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["contracts", "**/_spec/**", "**/_wire/**", "build", "target", "dist"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kryvola_ml"]
